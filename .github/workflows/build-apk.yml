name: Build Maya AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if uploaded directly
        run: |
          for f in MayaAssistant*.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Build Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          arguments: assembleDebug --no-daemon

      - name: Upload Maya Assistant APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
